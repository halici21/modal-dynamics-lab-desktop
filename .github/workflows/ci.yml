name: Source CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source:
    name: Typecheck, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and numerical tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

  interaction:
    name: Browser interaction and accessibility checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run deterministic interaction and accessibility suites
        run: >-
          npx playwright test
          tests/interaction/cad-r3-shell.spec.ts
          tests/interaction/cad-r3-studies.spec.ts
          tests/interaction/cad-r3-live-math.spec.ts
          tests/interaction/visual-experience-r2.spec.ts
